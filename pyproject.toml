[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-honeypot"
version = "0.1.0"
description = "A low-interaction SSH honeypot for isolated security research"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.4,<5",
]

[project.scripts]
ssh-honeypot = "ssh_honeypot.server:main"

[tool.setuptools.packages.find]
where = ["src"]
